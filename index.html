<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5 Hábitos de Consultoria Estratégica</title>
<style>
:root{
  --branco:#ffffff;
  --fundo:#f9f9f9;
  --fundo-2:#f0f0f0;
  --linha:#e0e0e0;
  --texto:#000000;
  --texto-2:#000000;
  --texto-3:#000000;
  --sinal:#000000;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--branco);
  color:var(--texto);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:4rem;
}
.envelope{max-width:34rem;margin:0 auto;padding:0 1.25rem}

/* topo */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(140%) blur(8px);
  border-bottom:1px solid var(--linha);
}
.barra{display:flex;align-items:center;gap:.75rem;height:52px}
.marca{font-family:var(--serif);font-size:1.02rem;letter-spacing:.01em;color:var(--texto);flex:1;cursor:pointer;font-weight:600}
.marca span{color:#000;font-weight:400}
.icone{
  background:var(--fundo-2);border:1px solid var(--linha);color:#000;
  border-radius:3px;padding:.35rem .6rem;font-size:.82rem;font-family:var(--sans);
  cursor:pointer;line-height:1.2;
}
.icone:hover{border-color:var(--texto);color:var(--texto)}
.icone:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid #000;outline-offset:2px
}

/* régua de progresso */
.regua{display:flex;gap:3px;height:3px;margin-bottom:1px}
.regua i{flex:1;background:var(--linha);display:block}
.regua i.feito{background:#000}
.regua i.agora{background:#8c8c8c}

/* estrutura */
main{padding-top:3.4rem}
.passo{animation:entra .22s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.passo{animation:none}}

.etiqueta{
  font-size:.78rem;color:#000;letter-spacing:.06em;margin-bottom:.4rem;font-weight:600;
}
h1{
  font-family:var(--serif);font-weight:400;font-size:1.85rem;line-height:1.2;
  margin:0 0 1rem;letter-spacing:-.01em;color:var(--texto)
}
h2{
  font-family:var(--serif);font-weight:400;font-size:1.35rem;line-height:1.25;
  margin:0 0 .7rem;color:var(--texto)
}
h3{font-size:.95rem;font-weight:600;margin:1.6rem 0 .5rem;color:var(--texto)}
p{margin:0 0 .85rem;color:var(--texto)}
.discreto{color:#000;font-size:.93rem}
.miudo{color:#000;font-size:.83rem;line-height:1.5}

/* narrativa do caso */
.historia{
  font-family:var(--serif);font-size:1.06rem;line-height:1.65;
  border-left:2px solid var(--linha);padding-left:1rem;margin:0 0 1.4rem;
  color:var(--texto);background:var(--fundo-2);padding:.8rem 1rem;
}
.historia p{margin:0 0 .8rem;color:inherit}
.historia p:last-child{margin-bottom:0}

.pergunta{
  font-size:1.02rem;font-weight:600;margin:0 0 .35rem;color:var(--texto)
}

/* campos */
textarea{
  width:100%;min-height:8.5rem;background:var(--branco);color:var(--texto);
  border:1px solid var(--linha);border-radius:3px;padding:.8rem;
  font-family:var(--sans);font-size:1rem;line-height:1.5;resize:vertical;
}
textarea:disabled{opacity:.75;color:var(--texto-2)}
input[type=number],input[type=text]{
  background:var(--branco);color:var(--texto);border:1px solid var(--linha);
  border-radius:3px;padding:.5rem .55rem;font-family:var(--sans);font-size:1rem;width:100%
}
input:disabled{opacity:.7}

/* botões */
.acoes{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem;align-items:center}
button.principal{
  background:#000;color:#fff;border:1px solid #000;border-radius:3px;
  padding:.72rem 1.15rem;font-size:.97rem;font-weight:600;font-family:var(--sans);cursor:pointer
}
button.principal:disabled{background:var(--fundo-2);color:#8c8c8c;cursor:not-allowed;border:1px solid var(--linha)}
button.secundaria{
  background:var(--branco);color:#000;border:1px solid #000;border-radius:3px;
  padding:.72rem 1rem;font-size:.95rem;font-family:var(--sans);cursor:pointer;font-weight:500
}
button.secundaria:hover{background:var(--fundo-2)}
button.secundaria:disabled{opacity:.45;cursor:not-allowed}

/* rubrica */
.rubrica{list-style:none;margin:.2rem 0 0;padding:0}
.rubrica li{margin:0 0 .1rem}
.rubrica label{
  display:flex;gap:.7rem;align-items:flex-start;padding:.6rem .7rem;
  border:1px solid var(--linha);border-radius:3px;cursor:pointer;background:var(--branco)
}
.rubrica label:hover{background:var(--fundo-2);border-color:var(--texto-3)}
.rubrica input{margin:.25rem 0 0;accent-color:var(--sinal);width:1.05rem;height:1.05rem;flex:none}
.rubrica label.marcado{border-color:#000;background:var(--fundo-2)}
.rubrica span{font-size:.95rem;line-height:1.45;color:var(--texto)}

/* veredito e gabarito */
.veredito{
  border:1px solid var(--linha);border-left:3px solid #000;
  background:var(--fundo-2);padding:.9rem 1rem;margin:0 0 1.2rem;border-radius:3px
}
.veredito strong{display:block;font-size:1rem;margin-bottom:.25rem;color:#000}
.veredito p{margin:0 0 .6rem;font-size:.94rem;color:#000}
.veredito p:last-child{margin-bottom:0}
.balanco{margin:.8rem 0 0}
.balanco .bloco{margin-bottom:.8rem}
.balanco .bloco:last-child{margin-bottom:0}
.balanco .cab{font-size:.82rem;font-weight:700;letter-spacing:.04em;margin-bottom:.25rem}
.balanco ul{margin:0;padding-left:1.1rem}
.balanco li{font-size:.92rem;line-height:1.45;margin-bottom:.2rem}
.balanco .vazio{font-size:.92rem;font-style:italic}

.gabarito{border-top:1px solid var(--linha);padding-top:1.3rem;margin-top:1.3rem}
.gabarito .rotulo{font-size:.78rem;color:#000;margin-bottom:.5rem;font-weight:700;letter-spacing:.04em}
.gabarito .corpo{font-family:var(--serif);font-size:1.05rem;line-height:1.62}
.gabarito .corpo p{margin:0 0 .8rem;color:var(--texto)}
.chave{
  font-family:var(--serif);font-size:1.18rem;line-height:1.4;color:#000;
  border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);
  padding:.9rem 0;margin:1.3rem 0 0;font-weight:600
}

.saibamaislabel{
  display:inline-block;margin-top:1.3rem;padding-top:1.3rem;border-top:1px solid var(--linha);font-size:.88rem;color:#000;font-weight:600;cursor:pointer;text-decoration:underline
}
.saibamaislabel:hover{text-decoration:underline}

.saibamais{
  background:var(--fundo-2);border:1px solid var(--linha);border-radius:3px;padding:1rem;margin:1rem 0;font-size:.92rem;line-height:1.6
}
.saibamais .metodo{font-weight:600;color:var(--texto);margin-bottom:.5rem}
.saibamais .autor{color:#000;font-size:.88rem;margin-bottom:.8rem;padding-bottom:.8rem;border-bottom:1px solid var(--linha)}
.saibamais p{margin:0 0 .6rem;color:#000}
.saibamais p:last-child{margin-bottom:0}

/* tabela */
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:0 0 1rem;background:var(--branco)}
th,td{padding:.5rem .4rem;text-align:right;border-bottom:1px solid var(--linha)}
th:first-child,td:first-child{text-align:left}
th{color:#000;font-weight:600;font-size:.8rem}
tfoot td{font-weight:700;border-bottom:none;border-top:1px solid var(--texto-3);color:var(--texto)}

/* ferramenta embutida */
.ferramenta{
  border:1px solid var(--linha);background:var(--fundo-2);border-radius:3px;
  padding:.9rem 1rem;margin:0 0 1.3rem
}
.ferramenta .titulo{font-size:.82rem;color:#000;margin-bottom:.6rem;font-weight:700;letter-spacing:.04em}
.saida{font-family:var(--serif);font-size:1.02rem;color:#000;margin-top:.7rem;min-height:1.4rem;font-weight:600}
.aviso-calc{font-size:.78rem;color:#000;margin-top:.5rem;font-style:italic}

/* ordenação */
.pilha{list-style:none;margin:0 0 1rem;padding:0;counter-reset:ord}
.pilha li{
  display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--linha);
  background:var(--branco);border-radius:3px;padding:.65rem .7rem;margin-bottom:.45rem
}
.pilha .num{
  counter-increment:ord;flex:none;width:1.5rem;height:1.5rem;border-radius:50%;
  border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;
  font-size:.8rem;color:#000;margin-top:.1rem;background:var(--fundo-2);font-weight:600
}
.pilha .num::before{content:counter(ord)}
.pilha .txt{flex:1;font-size:.93rem;line-height:1.45;color:var(--texto)}
.pilha .setas{display:flex;flex-direction:column;gap:.2rem;flex:none}
.pilha .setas button{
  background:var(--branco);border:1px solid var(--linha);color:#000;
  border-radius:2px;width:1.9rem;height:1.3rem;cursor:pointer;font-size:.7rem;line-height:1;padding:0
}
.pilha .setas button:hover{background:var(--fundo-2)}
.pilha .setas button:disabled{opacity:.3;cursor:not-allowed}

/* calibragem */
.calib{list-style:none;margin:0;padding:0}
.calib li{border-bottom:1px solid var(--linha);padding:.8rem 0}
.calib li:last-child{border-bottom:none}
.calib .q{font-size:.95rem;margin-bottom:.5rem;color:var(--texto);font-weight:500}
.faixa{display:flex;gap:.5rem;align-items:center}
.faixa span{font-size:.8rem;color:#000;flex:none}
.calib .resultado{font-size:.85rem;margin-top:.45rem}
.calib .dentro{color:#000;font-weight:700}
.calib .fora{color:#000;font-weight:700;text-decoration:underline}
.placar{
  font-family:var(--serif);font-size:2.6rem;line-height:1;margin:0 0 .3rem;color:var(--texto);font-weight:600
}

/* cronômetro */
.etapa-crono{font-size:.82rem;font-weight:700;letter-spacing:.04em;margin:0 0 .1rem}
.crono{
  font-family:var(--serif);font-size:2.8rem;line-height:1;margin:0 0 .3rem;
  font-variant-numeric:tabular-nums;color:var(--texto);font-weight:600
}
.crono.quente{color:#000;text-decoration:underline}

/* cartão final */
.cartao{border:1px solid var(--linha);border-radius:3px;padding:1.1rem 1.2rem;background:var(--fundo-2)}
.cartao ol{margin:0;padding-left:1.15rem}
.cartao li{font-family:var(--serif);font-size:1.06rem;line-height:1.45;margin-bottom:.7rem;color:var(--texto)}
.cartao li:last-child{margin-bottom:0}

/* trilha */
.trilha-item{border-top:1px solid var(--linha);padding:1.4rem 0}
.trilha-item:first-of-type{border-top:none}
.trilha-item h2{margin-bottom:.15rem}
.trilha-passo{margin:.9rem 0 0}
.trilha-passo .rot{font-size:.78rem;color:#000;margin-bottom:.15rem;font-weight:700;letter-spacing:.04em}
.trilha-passo p{margin:0;font-size:.95rem;color:#000}

.aviso{
  font-size:.88rem;color:#000;border:1px dashed var(--linha);
  border-radius:3px;padding:.7rem .8rem;margin:1.2rem 0 0;background:var(--fundo-2)
}
.modo-escolha{display:grid;gap:.6rem;margin:1.5rem 0 0}
.modo-escolha button{
  text-align:left;background:var(--branco);border:1px solid var(--linha);
  border-radius:3px;padding:.9rem 1rem;color:var(--texto);cursor:pointer;font-family:var(--sans)
}
.modo-escolha button:hover{border-color:var(--sinal);background:var(--fundo-2)}
.modo-escolha b{display:block;font-size:1rem;margin-bottom:.15rem;font-weight:600}
.modo-escolha em{font-style:normal;font-size:.88rem;color:#000}
.contagem{font-size:.88rem;color:#000;font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="envelope">
    <div class="barra">
      <div class="marca" id="marca">5 Hábitos <span id="modoRotulo"></span></div>
      <button class="icone" id="btnTrilha">Trilha</button>
      <button class="icone" id="btnReiniciar">Recomeçar</button>
    </div>
  </div>
  <div class="regua" id="regua"></div>
</header>

<main class="envelope" id="palco"></main>
<script>

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const palco = $("#palco");

function esc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmt(n){
  return n.toLocaleString("pt-BR",{maximumFractionDigits:2});
}
function irPara(i){
  estado.i = i;
  estado.fase = "escrever";
  estado.telaTrilha = false;
  salvar();
  window.scrollTo(0,0);
  render();
}
function proximo(){ irPara(Math.min(estado.i+1, PASSOS.length-1)); }

/* trava de ritmo do modo sala, ancorada no horário de início do passo */
let cronoId = null;
let timerTrava = null;
let travaAtiva = false;

function restante(id, segundos){
  if(!estado.travas) estado.travas = {};
  if(!estado.travas[id]){ estado.travas[id] = Date.now(); salvar(); }
  const passou = Math.floor((Date.now() - estado.travas[id]) / 1000);
  return Math.max(0, segundos - passou);
}

function travar(btn, id, segundos, textoBase, liberar){
  clearInterval(timerTrava);
  travaAtiva = false;
  if(estado.modo !== "sala"){ return; }
  let resta = restante(id, segundos);
  if(resta <= 0){ return; }

  travaAtiva = true;
  btn.disabled = true;
  const marca = document.createElement("span");
  marca.className = "contagem";
  btn.parentNode.appendChild(marca);

  const tick = ()=>{
    marca.textContent = textoBase + " " + resta + "s";
    if(resta <= 0){
      clearInterval(timerTrava);
      travaAtiva = false;
      marca.remove();
      if(liberar) liberar();
      return;
    }
    resta--;
  };
  tick();
  timerTrava = setInterval(tick, 1000);
}

/* ---------- régua ---------- */
function pintarRegua(){
  const marcos = PASSOS.map((p,idx)=>({p,idx})).filter(o=>["caso","calibragem","ordenacao","pitch"].includes(o.p.tipo));
  const r = $("#regua");
  r.innerHTML = marcos.map(o=>{
    if(estado.i > o.idx) return '<i class="feito"></i>';
    if(estado.i === o.idx) return '<i class="agora"></i>';
    return "<i></i>";
  }).join("");
  $("#modoRotulo").textContent = estado.modo ? (estado.modo==="sala" ? "· versão sala" : "· versão solo") : "";
}

/* ---------- render principal ---------- */
function render(){
  clearInterval(timerTrava);
  clearInterval(cronoId);
  travaAtiva = false;
  pintarRegua();
  if(estado.telaTrilha){ return telaTrilha(); }
  const passo = PASSOS[estado.i];
  switch(passo.tipo){
    case "abertura":   return telaAbertura();
    case "caso":       return telaCaso(passo);
    case "acerto":     return telaAcerto(passo);
    case "calibragem": return telaCalibragem(passo);
    case "ordenacao":  return telaOrdenacao(passo);
    case "pitch":      return telaPitch(passo);
    case "ferramenta": return telaFerramenta();
    case "cartao":     return telaCartao();
  }
}

/* ---------- blocos reutilizáveis ---------- */
function blocoRubrica(passo){
  const itens = [];
  passo.positivos.forEach((t,k)=>itens.push({k:"p"+k, t, bom:true}));
  passo.armadilhas.forEach((t,k)=>itens.push({k:"a"+k, t, bom:false}));
  const marc = estado.marcados[passo.id] || {};
  return `
    <p class="pergunta">Antes de ver qualquer coisa: o que a sua resposta continha?</p>
    <p class="discreto">Marque com honestidade. Ninguém além de você vê isso, e a lista é o que transforma a leitura do gabarito em aprendizado.</p>
    <ul class="rubrica">
      ${itens.map(it=>`
        <li><label class="${marc[it.k]?"marcado":""}">
          <input type="checkbox" data-k="${it.k}" ${marc[it.k]?"checked":""}>
          <span>${esc(it.t)}</span>
        </label></li>`).join("")}
    </ul>
    <div class="acoes"><button class="principal" id="verVeredito">Ver o que era esperado</button></div>`;
}

function contarRubrica(passo){
  const marc = estado.marcados[passo.id] || {};
  let bons = 0, ruins = 0;
  passo.positivos.forEach((_,k)=>{ if(marc["p"+k]) bons++; });
  passo.armadilhas.forEach((_,k)=>{ if(marc["a"+k]) ruins++; });
  return {bons, ruins};
}

function blocoVeredito(passo){
  const marc = estado.marcados[passo.id] || {};
  const certos = passo.positivos.filter((_,k)=>marc["p"+k]);
  const errados = passo.armadilhas.filter((_,k)=>marc["a"+k]);
  const faltou = passo.positivos.filter((_,k)=>!marc["p"+k]);

  let titulo, texto;
  if(errados.length === 0 && certos.length >= 2){
    titulo = "Certo.";
    texto = "Sua resposta tem o que a situação pedia e não tem nenhum dos erros típicos. Leia a explicação assim mesmo, para conferir se acertou pelo motivo certo.";
  } else if(errados.length === 0 && certos.length > 0){
    titulo = "Certo em parte.";
    texto = "Você não cometeu nenhum dos erros típicos, mas a resposta cobriu pouco do que a situação pedia.";
  } else if(certos.length > 0){
    titulo = "Certo em parte, errado em parte.";
    texto = "Uma parte da sua resposta está correta, e outra parte repete um erro que a situação foi montada para provocar.";
  } else if(errados.length > 0){
    titulo = "Errado.";
    texto = "Sua resposta caiu inteira no erro que a situação provoca. É o resultado mais comum aqui, e o mais útil: a explicação abaixo vale mais para você do que para quem escapou.";
  } else {
    titulo = "Não dá para avaliar.";
    texto = "Você não marcou nada na lista, nem acerto nem erro. Leia a explicação e volte à sua resposta para comparar por conta própria.";
  }

  const lista = (cab, itens, vazio) => `
    <div class="bloco">
      <div class="cab">${cab}</div>
      ${itens.length
        ? `<ul>${itens.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`
        : `<div class="vazio">${vazio}</div>`}
    </div>`;

  return `<div class="veredito">
    <strong>${titulo}</strong>
    <p>${texto}</p>
    <div class="balanco">
      ${lista("O que está certo na sua resposta", certos, "Nada do que a situação pedia apareceu.")}
      ${lista("O que está errado na sua resposta", errados, "Nenhum dos erros típicos.")}
      ${lista("O que faltou", faltou, "Nada. Você cobriu tudo.")}
    </div>
  </div>`;
}

function blocoGabarito(passo){
  let saiba = "";
  if(passo.metodo){
    saiba = `<div class="saibamais">
      <div class="metodo">${esc(passo.metodo)}</div>
      <div class="autor">${esc(passo.autor)}</div>
      <p>${esc(passo.saibamais)}</p>
    </div>`;
  }
  return `
    <div class="gabarito">
      <div class="rotulo">O que é recomendado</div>
      <div class="corpo">${passo.gabarito.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
      <div class="chave">${esc(passo.chave)}</div>
      ${saiba}
    </div>
    ${estado.modo==="sala" ? `<div class="aviso">Pausa de discussão: dois minutos com quem está ao lado. Quem escapou explica por quê.</div>` : ""}
    <div class="acoes"><button class="principal" id="seguir">Continuar</button></div>`;
}

function ligarRubrica(passo){
  palco.querySelectorAll(".rubrica input").forEach(cb=>{
    cb.onchange = ()=>{
      if(!estado.marcados[passo.id]) estado.marcados[passo.id] = {};
      estado.marcados[passo.id][cb.dataset.k] = cb.checked;
      cb.closest("label").classList.toggle("marcado", cb.checked);
      salvar();
    };
  });
  const b = $("#verVeredito");
  if(b) b.onclick = ()=>{ estado.fase = "revelar"; salvar(); window.scrollTo(0,0); render(); };
}
function ligarSeguir(){
  const b = $("#seguir");
  if(b) b.onclick = proximo;
}

function telaCaso(passo){
  const cabeca = `
    <div class="etiqueta">Situação ${passo.n} de 5</div>
    <h1>${esc(passo.nome)}</h1>
    <div class="historia">${passo.historia.map(p=>`<p>${esc(p)}</p>`).join("")}</div>

  if(estado.fase === "escrever"){
    palco.innerHTML = `<div class="passo">${cabeca}
      <p class="pergunta">${esc(passo.pergunta)}</p>
      <p class="miudo">${esc(passo.ajuda||"")}</p>
      <textarea id="resp" placeholder="Escreva aqui.">${esc(estado.respostas[passo.id]||"")}</textarea>
      <div class="acoes"><button class="principal" id="travar" disabled>Enviar resposta</button></div>
      <p class="miudo" style="margin-top:.6rem">Depois de enviar não dá para editar. É de propósito.</p>
    </div>`;
    const ta = $("#resp"), bt = $("#travar");
    const checa = ()=>{ bt.disabled = travaAtiva; };
    ta.oninput = ()=>{ estado.respostas[passo.id] = ta.value; salvar(); checa(); };
    bt.onclick = ()=>{ estado.fase="rubrica"; salvar(); window.scrollTo(0,0); render(); };
    if(estado.modo === "sala"){
      const bloqueio = document.createElement("div");
      bloqueio.className = "aviso";
      bloqueio.textContent = "Versão sala: o botão de enviar libera depois de 90 segundos, para o grupo escrever junto.";
      palco.querySelector(".passo").appendChild(bloqueio);
      travar(bt, passo.id, 90, "libera em", checa);
    }
    checa();
    return;
  }

  const suaResposta = `
    <div class="ferramenta"><div class="titulo">O que você escreveu</div>
      <div style="font-size:.95rem;line-height:1.5;white-space:pre-wrap;color:var(--texto)">${esc(estado.respostas[passo.id]||"")}</div>
    </div>`;

  if(estado.fase === "rubrica"){
    palco.innerHTML = `<div class="passo">
      <div class="etiqueta">Situação ${passo.n} de 5</div>
      <h1>${esc(passo.nome)}</h1>
      ${suaResposta}${blocoRubrica(passo)}</div>`;
    ligarRubrica(passo);
    return;
  }

  palco.innerHTML = `<div class="passo">
    <div class="etiqueta">Situação ${passo.n} de 5</div>
    <h1>${esc(passo.nome)}</h1>
    ${blocoVeredito(passo)}${suaResposta}${blocoGabarito(passo)}</div>`;
  ligarSeguir();
}

  {n:"Indústria",    r23:400, m23:12,   r26:420,  m26:12.5}
];
function tabelaMargem(){
  const t23 = UNIDADES.reduce((a,u)=>a+u.r23,0);
  const t26 = UNIDADES.reduce((a,u)=>a+u.r26,0);
  const l23 = UNIDADES.reduce((a,u)=>a+u.r23*u.m23/100,0);
  const l26 = UNIDADES.reduce((a,u)=>a+u.r26*u.m26/100,0);
  return `
  <table>
    <thead><tr><th>Unidade</th><th>Receita 2023</th><th>Margem 2023</th><th>Receita 2026</th><th>Margem 2026</th></tr></thead>
    <tbody>
      ${UNIDADES.map(u=>`<tr>
        <td>${u.n}</td><td>${fmt(u.r23)}</td><td>${fmt(u.m23)}%</td>
        <td>${fmt(u.r26)}</td><td>${fmt(u.m26)}%</td></tr>`).join("")}
    </tbody>
    <tfoot><tr>
      <td>Grupo</td><td>${fmt(t23)}</td><td>${(l23/t23*100).toFixed(1)}%</td>
      <td>${fmt(t26)}</td><td>${(l26/t26*100).toFixed(1)}%</td>
    </tr></tfoot>
  </table>`;
}
/* ---------- micro acerto ---------- */
function telaAcerto(passo){
  const escolhido = estado.acertos[passo.id];
  palco.innerHTML = `<div class="passo">
    <div class="etiqueta">${esc(passo.intro)}</div>
    <h2>${esc(passo.pergunta)}</h2>
    <ul class="rubrica" style="margin-top:1rem">
      ${passo.opcoes.map((o,k)=>`
        <li><label class="${escolhido===k?"marcado":""}">
          <input type="radio" name="op" value="${k}" ${escolhido===k?"checked":""} ${escolhido!=null?"disabled":""}>
          <span>${esc(o)}</span>
        </label></li>`).join("")}
    </ul>
    <div id="retorno"></div>
  </div>`;
  const mostrar = ()=>{
    const k = estado.acertos[passo.id];
    const certo = k === passo.certa;
    $("#retorno").innerHTML = `
      <div class="veredito" style="margin-top:1.2rem">
        <strong>${certo?"Isso.":"Não é essa."}</strong>
        <p>${certo ? esc(passo.nota) : "A resposta é: " + esc(passo.opcoes[passo.certa]) + ". " + esc(passo.nota)}</p>
      </div>
      <div class="acoes"><button class="principal" id="seguir">Continuar</button></div>`;
    ligarSeguir();

  if(escolhido != null){ mostrar(); return; }
  palco.querySelectorAll("input[name=op]").forEach(r=>{

      salvar();

      r.closest("label").classList.add("marcado");

}

/* ---------- calibragem ---------- */
function telaCalibragem(passo){
  if(!estado.calibFeito){
    palco.innerHTML = `<div class="passo">
      <div class="etiqueta">Situação ${passo.n} de 5</div>
      <h1>${esc(passo.nome)}</h1>
      <div class="historia">${passo.historia.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
      <ul class="calib">
        ${CALIBRAGEM.map((c,k)=>{
          const g = estado.calib[k]||{};
          return `<li>
            <div class="q">${k+1}. ${esc(c.q)}</div>
            <div class="faixa">
              <span>mín</span><input type="number" inputmode="decimal" data-k="${k}" data-lado="min" value="${g.min??""}">
              <span>máx</span><input type="number" inputmode="decimal" data-k="${k}" data-lado="max" value="${g.max??""}">
            </div>
          </li>`;
        }).join("")}
      </ul>
      <div class="acoes"><button class="principal" id="corrigir" disabled>Enviar resposta</button></div>
    </div>`;
    const bt = $("#corrigir");
    const checa = ()=>{
      const ok = CALIBRAGEM.every((_,k)=>{
        const g = estado.calib[k];
        return g && g.min !== "" && g.max !== "" && g.min != null && g.max != null;
      });
      bt.disabled = !ok;
    };
    palco.querySelectorAll(".calib input").forEach(inp=>{
      inp.oninput = ()=>{
        const k = inp.dataset.k;
        if(!estado.calib[k]) estado.calib[k] = {};
        estado.calib[k][inp.dataset.lado] = inp.value === "" ? "" : Number(inp.value);
        salvar(); checa();
      };
    });
    checa();
    bt.onclick = ()=>{ estado.calibFeito = true; salvar(); window.scrollTo(0,0); render(); };
    return;
  }

  let dentro = 0;
  const linhas = CALIBRAGEM.map((c,k)=>{
    const g = estado.calib[k]||{};
    const lo = Math.min(g.min,g.max), hi = Math.max(g.min,g.max);
    const ok = c.v >= lo && c.v <= hi;
    if(ok) dentro++;
    return `<li>
      <div class="q">${k+1}. ${esc(c.q)}</div>
      <div class="resultado ${ok?"dentro":"fora"}">
        Resposta: ${fmt(c.v)} ${esc(c.u)} · seu intervalo: ${fmt(lo)} a ${fmt(hi)} · ${ok?"dentro":"fora"}
      </div>
    </li>`;
  }).join("");

  const bom = dentro >= 4;
  palco.innerHTML = `<div class="passo">
    <div class="etiqueta">Situação ${passo.n} de 5</div>
    <h1>${esc(passo.nome)}</h1>
    <div class="placar">${dentro} de 5</div>
    <p class="discreto">Você declarou 90% de confiança em cada intervalo. Com cinco perguntas, o resultado coerente com isso é quatro ou cinco acertos.</p>
    <div class="veredito">
      <strong>${bom?"Certo. Seus intervalos estão honestos.":"Errado. Seus intervalos estão estreitos demais."}</strong>
      <p>${bom
        ? "É raro. Repare que você pagou por isso com intervalos largos, e que largura não é fraqueza: é informação sobre o que você não sabe."
        : "A maioria das pessoas fica em dois ou três. Não é falta de conhecimento, é excesso de confiança: você achou que sabia mais do que sabe, e o intervalo que desenhou revela isso."}</p>
    </div>
    <ul class="calib">${linhas}</ul>
    <div class="gabarito">
      <div class="rotulo">O que é recomendado</div>
      <div class="corpo">
        <p>Ninguém pediu que você soubesse a altura do Everest. Pediu que soubesse o quanto não sabe, e isso quase todo mundo erra na mesma direção.</p>
        <p>Na prática, isso aparece quando você entrega uma projeção de 42 milhões. O número parece firme, e quem recebe vai tratar como firme. Se a faixa honesta fosse de 30 a 58, a decisão possível é outra, e a pessoa que decidiu tinha o direito de saber.</p>
        <p>Intervalo largo não é sinal de análise fraca. É a única forma de dizer com precisão o tamanho da sua incerteza.</p>
      </div>
      <div class="chave">${esc(passo.chave)}</div>
      <div class="saibamais">
        <div class="metodo">${esc(passo.metodo)}</div>
        <div class="autor">${esc(passo.autor)}</div>
        <p>${esc(passo.saibamais)}</p>
      </div>
    </div>
    ${estado.modo==="sala" ? `<div class="aviso">Pausa de discussão: compare seu placar com o de duas pessoas ao lado. Alguém fez mais de 8?</div>` : ""}
    <div class="acoes"><button class="principal" id="seguir">Continuar</button></div>
  </div>`;
  ligarSeguir();
}

/* ---------- ordenação ---------- */

  const cabeca = `

      <p class="pergunta">${esc(passo.pergunta)}</p>

      <ol style="margin:0;padding-left:1.2rem;font-size:.92rem;line-height:1.5">

      </ol>
      <p class="miudo" style="margin:.7rem 0 0">As duas evidências que contrariam a recomendação ficaram nas posições ${posContra.join(" e ")}.</p>
    </div>`;

  if(estado.fase === "rubrica"){
    palco.innerHTML = `<div class="passo">
      <div class="etiqueta">Situação ${passo.n} de 5</div>
      <h1>${esc(passo.nome)}</h1>
      ${resumo}${blocoRubrica(passo)}</div>`;
    ligarRubrica(passo);
    return;
  }

  palco.innerHTML = `<div class="passo">
    <div class="etiqueta">Situação ${passo.n} de 5</div>
    <h1>${esc(passo.nome)}</h1>
    ${blocoVeredito(passo)}${resumo}${blocoGabarito(passo)}</div>`;

}

/* ---------- pitch de 40 segundos ---------- */
function telaPitch(passo){
  const cabeca = `
    <div class="etiqueta">Situação ${passo.n} de 5</div>
    <h1>${esc(passo.nome)}</h1>
    <div class="historia">${passo.historia.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;

  if(estado.fase === "escrever"){
    palco.innerHTML = `<div class="passo">${cabeca}
      <p class="pergunta">${esc(passo.pergunta)}</p>
      <div class="etapa-crono" id="etapa">Lendo a cena</div>
      <div class="crono" id="crono">40</div>
      <textarea id="resp" disabled placeholder="O campo abre sozinho quando os 40 segundos de leitura acabarem."></textarea>
      <div class="acoes">
        <button class="secundaria" id="travar" disabled>Enviar resposta antes do tempo</button>
      </div>
    </div>`;
    const ta = $("#resp"), cr = $("#crono"), et = $("#etapa"), bt = $("#travar");
    const encerrar = ()=>{
      clearInterval(cronoId);
      ta.disabled = true;
      estado.respostas[passo.id] = ta.value;
      estado.fase = "rubrica";
      salvar();
      window.scrollTo(0,0);
      render();
    };
    const contar = (segundos, aoFim)=>{
      let t = segundos;
      cr.textContent = t;
      cr.classList.remove("quente");
      clearInterval(cronoId);
      cronoId = setInterval(()=>{
        t--;
        cr.textContent = Math.max(0, t);
        if(t <= 10) cr.classList.add("quente");
        if(t <= 0){ clearInterval(cronoId); aoFim(); }
      },1000);
    };
    const abrirEscrita = ()=>{
      et.textContent = "Escrevendo a resposta";
      ta.disabled = false;
      bt.disabled = false;
      ta.focus();
      contar(40, encerrar);
    };
    contar(40, abrirEscrita);
    bt.onclick = encerrar;
    return;
  }

  const suaResposta = `
    <div class="ferramenta"><div class="titulo">O que deu tempo de escrever</div>
      <div style="font-size:.95rem;line-height:1.5;white-space:pre-wrap;color:var(--texto)">${esc(estado.respostas[passo.id]||"(nada)")}</div>
    </div>`;

  if(estado.fase === "rubrica"){
    palco.innerHTML = `<div class="passo">
      <div class="etiqueta">Situação ${passo.n} de 5</div>
      <h1>${esc(passo.nome)}</h1>
      ${suaResposta}${blocoRubrica(passo)}</div>`;
    ligarRubrica(passo);
    return;
  }

  palco.innerHTML = `<div class="passo">
    <div class="etiqueta">Situação ${passo.n} de 5</div>
    <h1>${esc(passo.nome)}</h1>
    ${blocoVeredito(passo)}${suaResposta}${blocoGabarito(passo)}</div>`;
  ligarSeguir();
}

/* ---------- cartão final ---------- */
const CARTAO = [
  "Que decisão vai ser tomada com isto?",
  "Como esse número é calculado?",
  "Quão largo é o intervalo?",
  "Quando a consequência ruim aparece?",
  "Se eu tivesse 40 segundos, o que diria?"
];
function telaCartao(){
  palco.innerHTML = `<div class="passo">
    <div class="etiqueta">Fim</div>
    <h1>Você entrou com cinco erros. Sai com cinco perguntas.</h1>
    <p>Não são um método nem um framework. São cinco frases curtas que, feitas na hora certa, evitam a maior parte do que você errou aqui.</p>
    <div class="cartao"><ol>${CARTAO.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
    <h3>O que fazer com isso</h3>
    <p class="discreto">Daqui a 48 horas, tente escrever as cinco de memória. Daqui a uma semana, de novo. Daqui a três semanas, a mais valiosa das três, sem consultar nada. Reformular diferente não é erro: é sinal de que virou seu.</p>
    <div class="acoes">
      <button class="secundaria" id="copiar">Copiar meu resumo</button>
      <button class="secundaria" id="paraTrilha">Ver a trilha de aprendizado</button>
    </div>
    <p class="miudo" id="avisoCopia" style="margin-top:.6rem"></p>
    <div class="aviso">Se você abriu este arquivo direto do celular, o progresso pode não sobreviver ao fechamento do aplicativo. Copie o resumo antes de sair.</div>
  </div>`;
  $("#paraTrilha").onclick = ()=>{ estado.telaTrilha = true; salvar(); window.scrollTo(0,0); render(); };
  $("#copiar").onclick = async ()=>{
    const linhas = [];
    linhas.push("5 HÁBITOS DE CONSULTORIA ESTRATÉGICA · meu resumo");
    linhas.push("");
    const f = estado.ferramenta;
    linhas.push("A frase, aplicada ao meu trabalho:");
    linhas.push(`Esta análise existe para que ${f.quem||"______"} decida ${f.oque||"______"} até ${f.quando||"______"}, usando ${f.criterio||"______"}.`);
    linhas.push("");
    linhas.push("As cinco perguntas:");
    CARTAO.forEach((q,k)=>linhas.push(`${k+1}. ${q}`));
    linhas.push("");
    linhas.push("O que eu respondi:");
    PASSOS.filter(p=>estado.respostas[p.id]).forEach(p=>{
      linhas.push(`· ${p.nome}: ${estado.respostas[p.id]}`);
    });
    const dentro = CALIBRAGEM.reduce((a,c,k)=>{
      const g = estado.calib[k]; if(!g) return a;
      const lo=Math.min(g.min,g.max), hi=Math.max(g.min,g.max);
      return a + (c.v>=lo && c.v<=hi ? 1 : 0);
    },0);
    if(estado.calibFeito) linhas.push(`· Calibragem: ${dentro} de 5 dentro do intervalo declarado de 90%.`);
    const texto = linhas.join("\n");
    const aviso = $("#avisoCopia");
    try{
      await navigator.clipboard.writeText(texto);
      aviso.textContent = "Resumo copiado. Cole onde quiser guardar.";
    }catch(e){
      const ta = document.createElement("textarea");
      ta.value = texto; ta.style.width="100%"; ta.style.minHeight="14rem";
      aviso.textContent = "A cópia automática não funcionou aqui. Selecione o texto abaixo e copie na mão.";
      aviso.after(ta); ta.select();
    }
  };
}
